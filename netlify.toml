[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança básicos (achado V9 da auditoria de 2026-11-01).
# A CSP vai em Report-Only de propósito: o app tem 1 handler inline
# (onload= no <link> de fonte em index.html) e usa bastante style inline do
# React (style={{...}}), então uma CSP já bloqueando quebraria algo sem
# aviso — Report-Only só loga no console do navegador, nunca bloqueia nada,
# servindo pra enxergar o que precisaria mudar antes de um dia aplicar de
# verdade.
# Atualizada na auditoria de 2026-11-10 (item 11): a política agora já inclui o que
# o OCR (tesseract.js, via cdn.jsdelivr.net com versão fixa) e o handler onload
# da fonte precisam. Continua Report-Only até conferir o console em produção
# sem violações; aí é só trocar o nome do cabeçalho (e o de vercel.json).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/tesseract.js@v7.0.0/ https://cdn.jsdelivr.net/npm/tesseract.js-core@v7.0.0/; script-src-attr 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net/npm/tesseract.js@v7.0.0/ https://cdn.jsdelivr.net/npm/tesseract.js-core@v7.0.0/ https://cdn.jsdelivr.net/npm/@tesseract.js-data/; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
