name: Build Android APK

# This is the reproducible build for the Capacitor-wrapped app (see
# capacitor.config.ts / android/) — it exists because the SDK download this
# needs (dl.google.com) isn't reachable from the sandboxed session that
# built this workflow, so this is where the APK actually gets compiled.
# GitHub-hosted runners have no such restriction.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Build de release assinado com uma keystore própria (em vez da chave de
      # debug automática do Android) — instalar um APK assinado com uma chave
      # de verdade é menos propenso a acionar o aviso de segurança do Google
      # Play Protect do que um build de debug. Só roda quando os 4 secrets de
      # assinatura estão configurados no repositório; sem eles, esse passo é
      # pulado e o workflow segue publicando só o APK de debug normalmente.
      - name: Decode release keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: ${{ steps.keystore.outputs.has_keystore == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ steps.keystore.outputs.has_keystore == 'true' }}
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
