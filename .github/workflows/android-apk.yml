name: Build Android APK

# This is the reproducible build for the Capacitor-wrapped app (see
# capacitor.config.ts / android/) — it exists because the SDK download this
# needs (dl.google.com) isn't reachable from the sandboxed session that
# built this workflow, so this is where the APK actually gets compiled.
# GitHub-hosted runners have no such restriction.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `secrets.X` não pode ser referenciado direto num `if:` de step —
      # o GitHub Actions rejeita a expressão com "Unrecognized named-value:
      # 'secrets'" nesse contexto. Passar pelo `env` do job primeiro é o
      # jeito documentado de contornar isso.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename debug APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/gestao-de-vendas-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: gestao-de-vendas-debug
          path: android/app/build/outputs/apk/debug/gestao-de-vendas-debug.apk
          retention-days: 30

      # Build de release assinado com uma keystore própria (em vez da chave de
      # debug automática do Android) — instalar um APK assinado com uma chave
      # de verdade é menos propenso a acionar o aviso de segurança do Google
      # Play Protect do que um build de debug. Só roda quando os 4 secrets de
      # assinatura estão configurados no repositório; sem eles, esse passo é
      # pulado e o workflow segue publicando só o APK de debug normalmente.
      - name: Decode release keystore
        id: keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      # Diagnóstico temporário (não expõe nenhum valor de secret, só
      # tamanho/hash/sucesso-falha) — para achar se o problema é o secret
      # ANDROID_KEYSTORE_BASE64 (arquivo corrompido/truncado) ou o secret
      # ANDROID_KEYSTORE_PASSWORD (valor errado). Remover depois de resolvido.
      - name: Debug keystore secrets (sem expor valores)
        if: ${{ steps.keystore.outputs.has_keystore == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Tamanho do arquivo release.keystore (esperado: 2772 bytes):"
          wc -c < android/app/release.keystore
          echo "SHA-256 do release.keystore (esperado: e493e983ab4e98ba425ca705124895aa56b902b228cf9215bff1da2562945504):"
          sha256sum android/app/release.keystore
          echo "Tamanho do secret ANDROID_KEYSTORE_PASSWORD (esperado: 32 caracteres):"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | wc -c
          echo "Tentando abrir a keystore com o secret ANDROID_KEYSTORE_PASSWORD:"
          keytool -list -keystore android/app/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" || echo "FALHOU AO ABRIR COM ESSA SENHA"

      - name: Build signed release APK
        if: ${{ steps.keystore.outputs.has_keystore == 'true' }}
        working-directory: android
        env:
          # Caminho absoluto: o `file()` do Gradle, dentro de android/app/build.gradle,
          # resolve caminho relativo a partir do diretório do subprojeto `app`
          # (android/app/) e não do working-directory deste step (android/) — um
          # relativo aqui vira android/app/app/release.keystore, que não existe.
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename release APK
        if: ${{ steps.keystore.outputs.has_keystore == 'true' }}
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/gestao-de-vendas.apk

      - uses: actions/upload-artifact@v7
        if: ${{ steps.keystore.outputs.has_keystore == 'true' }}
        with:
          name: gestao-de-vendas
          path: android/app/build/outputs/apk/release/gestao-de-vendas.apk
          retention-days: 30
